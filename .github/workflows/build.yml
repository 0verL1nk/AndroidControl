name: build

# 服务端（relay/）是私有 submodule，它的测试与 E2E 在私有仓库 AndroidControl-relay 的 CI 里跑。
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  android:
    name: Android（协议测试 + APK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建与单元测试
        run: |
          chmod +x gradlew
          ./gradlew :protocol:test :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk

  web:
    name: 网页（类型检查 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装并检查
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm test

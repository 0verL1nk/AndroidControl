name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  android:
    name: Android（协议测试 + 两端 APK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建与单元测试
        run: |
          chmod +x gradlew
          ./gradlew :protocol:test :agent:assembleDebug :controller:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            agent/build/outputs/apk/debug/*.apk
            controller/build/outputs/apk/debug/*.apk

  relay:
    name: 中继（Rust 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: 测试
        run: cargo test --manifest-path relay/Cargo.toml
